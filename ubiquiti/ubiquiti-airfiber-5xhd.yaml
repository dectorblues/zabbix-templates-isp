zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: bf8a3a382f6d48fe9c02d41916f1a02e
    name: Templates/Network devices
  templates:
  - uuid: 71a46371fe924b6295083212932d0c30
    template: Template Ubiquiti airFiber 5XHD
    name: Template Ubiquiti airFiber 5XHD
    description: 'Ubiquiti airFiber 5XHD / AF-LTU via UBNT-AFLTU-MIB (1.3.6.1.4.1.41112.1.10): frequência, largura de canal, descoberta dos enlaces com sinal local e remoto, capacidade, modulação e distância.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 7717e1289c614329b1d8aec864c9317e
      name: 'airFiber: Largura de canal'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.41112.1.10.1.2.4.0
      key: af.chwidth
      delay: 5m
      units: MHz
    - uuid: ff4b50b19bb74a0dacf5a718f54886c2
      name: 'airFiber: Nome do dispositivo'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.41112.1.10.1.3.3.0
      key: af.devname
      delay: 1h
      history: 7d
      value_type: CHAR
    - uuid: 055ab6445cda4117be0ae3feb1cf03de
      name: 'Porta Ethernet: bytes recebidos'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.41112.1.10.1.5.1.0
      key: af.eth.in
      value_type: FLOAT
      units: Bps
      preprocessing:
      - type: CHANGE_PER_SECOND
    - uuid: 7fefcc2d685748f09784749c9bcf4266
      name: 'Porta Ethernet: bytes enviados'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.41112.1.10.1.5.3.0
      key: af.eth.out
      value_type: FLOAT
      units: Bps
      preprocessing:
      - type: CHANGE_PER_SECOND
    - uuid: a6e5c7ae6c5944b5bdb80fc889471b24
      name: 'airFiber: Firmware'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.41112.1.10.1.3.4.0
      key: af.firmware
      delay: 1h
      history: 7d
      value_type: CHAR
      triggers:
      - uuid: 9f69e0c39ff749d8b622100a6e9c4426
        expression: change(/Template Ubiquiti airFiber 5XHD/af.firmware)=1
        name: 'airFiber: firmware mudou'
        priority: INFO
        manual_close: 'YES'
    - uuid: 0ee53ca9cc94419698bbe485a614e43c
      name: 'airFiber: Frequência'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.41112.1.10.1.2.2.0
      key: af.freq
      delay: 5m
      units: MHz
    - uuid: ec87f579acf44d2da53277922c8be149
      name: 'airFiber: Modelo'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.41112.1.10.1.3.2.0
      key: af.model
      delay: 1h
      history: 7d
      value_type: CHAR
    - uuid: bbb2f0f80b304bffbf88497f4d97616a
      name: 'airFiber: SSID'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.41112.1.10.1.2.5.0
      key: af.ssid
      delay: 1h
      history: 7d
      value_type: CHAR
    - uuid: 1d38cd7306ba4fe79e7bea042f72d07e
      name: 'airFiber: Uptime'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: af.uptime
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      triggers:
      - uuid: 92b53f98c05849ddb6286d05c49a4a02
        expression: last(/Template Ubiquiti airFiber 5XHD/af.uptime)<10m
        name: airFiber reiniciou (uptime < 10m)
        priority: INFO
    discovery_rules:
    - uuid: fb0182ff65af49b295d683de4f8560af
      name: 'airFiber: Enlaces'
      type: SNMP_AGENT
      snmp_oid: discovery[{#MAC},1.3.6.1.4.1.41112.1.10.1.4.1.11,{#REMNAME},1.3.6.1.4.1.41112.1.10.1.4.1.13,{#REMIP},1.3.6.1.4.1.41112.1.10.1.4.1.25]
      key: af.link.discovery
      delay: 1h
      item_prototypes:
      - uuid: 0e36bfa28d45416693cc92561e515668
        name: 'Enlace {#REMNAME}: Distância'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.41112.1.10.1.4.1.23.{#SNMPINDEX}
        key: af.link.distance[{#SNMPINDEX}]
        delay: 1h
        units: m
      - uuid: 4f1984dcbb6f4c2f96104fd0c3d7ec4a
        name: 'Enlace {#REMNAME}: Sinal remoto cadeia 0'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.41112.1.10.1.4.1.16.{#SNMPINDEX}
        key: af.link.remrx0[{#SNMPINDEX}]
        value_type: FLOAT
        units: dBm
      - uuid: 87004611649f45a2afb22e460f727597
        name: 'Enlace {#REMNAME}: Sinal remoto cadeia 1'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.41112.1.10.1.4.1.17.{#SNMPINDEX}
        key: af.link.remrx1[{#SNMPINDEX}]
        value_type: FLOAT
        units: dBm
      - uuid: 31b5320245be4d85bdaea64779082a14
        name: 'Enlace {#REMNAME}: Sinal local cadeia 0'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.41112.1.10.1.4.1.5.{#SNMPINDEX}
        key: af.link.rx0[{#SNMPINDEX}]
        value_type: FLOAT
        units: dBm
        trigger_prototypes:
        - uuid: fcf6686475634aa3849bef148569f731
          expression: avg(/Template Ubiquiti airFiber 5XHD/af.link.rx0[{#SNMPINDEX}],5m)<{$AF.SINAL.MIN}
          name: 'Enlace {#REMNAME}: sinal fraco (< {$AF.SINAL.MIN} dBm)'
          priority: AVERAGE
      - uuid: 855449488c2d4f069dc4e8022b75d4c8
        name: 'Enlace {#REMNAME}: Sinal local cadeia 1'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.41112.1.10.1.4.1.6.{#SNMPINDEX}
        key: af.link.rx1[{#SNMPINDEX}]
        value_type: FLOAT
        units: dBm
      - uuid: aed9547403054a1e94b688d18585a9ad
        name: 'Enlace {#REMNAME}: Capacidade RX'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.41112.1.10.1.4.1.3.{#SNMPINDEX}
        key: af.link.rxcap[{#SNMPINDEX}]
        units: bps
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '1000'
        trigger_prototypes:
        - uuid: 4ad3ff5c3a1c4b809bf9e81d8b8b76de
          expression: avg(/Template Ubiquiti airFiber 5XHD/af.link.rxcap[{#SNMPINDEX}],10m)<{$AF.CAP.MIN}
          name: 'Enlace {#REMNAME}: capacidade baixa (< {$AF.CAP.MIN})'
          priority: WARNING
      - uuid: 736a9c38e66c4346b006146e28a089e2
        name: 'Enlace {#REMNAME}: Sinal esperado'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.41112.1.10.1.4.1.7.{#SNMPINDEX}
        key: af.link.rxideal[{#SNMPINDEX}]
        delay: 5m
        value_type: FLOAT
        units: dBm
      - uuid: 2b45594361bc4572813f27ae3959a042
        name: 'Enlace {#REMNAME}: Modulação RX'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.41112.1.10.1.4.1.2.{#SNMPINDEX}
        key: af.link.rxrate[{#SNMPINDEX}]
        units: x
      - uuid: 6f59acaf77494faebf526ea27e379ee6
        name: 'Enlace {#REMNAME}: Capacidade TX'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.41112.1.10.1.4.1.4.{#SNMPINDEX}
        key: af.link.txcap[{#SNMPINDEX}]
        units: bps
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '1000'
      - uuid: 325d71ccbf794f38bab231441e89b569
        name: 'Enlace {#REMNAME}: Modulação TX'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.41112.1.10.1.4.1.1.{#SNMPINDEX}
        key: af.link.txrate[{#SNMPINDEX}]
        units: x
    tags:
    - tag: fabricante
      value: ubiquiti
    - tag: tecnologia
      value: airfiber
    macros:
    - macro: '{$AF.CAP.MIN}'
      value: 50M
      description: Capacidade mínima do enlace (bps)
    - macro: '{$AF.SINAL.MIN}'
      value: '-70'
      description: Sinal mínimo aceitável (dBm)
